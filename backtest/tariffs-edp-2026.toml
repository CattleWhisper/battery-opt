# EDP fixed-price tariffs (electricity), for simulate_big_battery.py
#
#   python backtest/simulate_big_battery.py --tariffs backtest/tariffs-edp-2026.toml ...
#
# Transcribed from the EDP price sheets the owner downloaded (2026-09-17):
#   tarifarios-eletricidade.pdf          general list, dated 02/01/2026,
#                                        "contratos a partir de 22/01/2024" (p.N below)
#   tarifarios-campanha-descontos-para-sempre_26fev26-3.pdf   scanned; read by OCR
#   tarifario-digital-20.pdf, tarifarios-15-energia-2.pdf,
#   tarifarios-30-potencia.pdf, tarifarios-50_60-em-fatura.pdf,
#   tarifario-pingo-doce.pdf
#
# ONLY the 4,6 kVA rows (the contracted power; CONTEXT.md). The sheets
# also list 1,15-41,4 kVA, and the energy price changes above 10,35 kVA.
#
# Verification: every value below equals the base price x (1 - discount),
# rounded to 4 decimals as EDP prints it - checked for all 71 values,
# which is what catches an OCR or transcription slip. Base at 4,6 kVA:
#   simples  0.4347 EUR/day + 0.1671
#   bi       0.5717 EUR/day + vazio 0.1119, fora de vazio 0.1935
#   tri      0.5717 EUR/day + vazio 0.1119, cheias 0.1394, ponta 0.2856
#
# EUR excl. VAT: the sheets do not say, but the "15% desconto no consumo"
# Simples energy price (0.1420) is exactly the invoiced energy price
# excl. VAT that backtest/simulate_bill.py reproduces the bill from.
#
# Read before trusting a ranking:
# - Offers that share a price set appear ONCE; the comment above each
#   entry lists every offer that uses it.
# - "12m" offers revert after 12 months. Their second year is the
#   "base" entry for the same option.
# - Every bi/tri-horaria offer can be contracted on either cycle at the
#   same prices, so each appears twice: "... semanal" and "... diario".
#   The prices are identical; only the ponta/cheias/vazio hours differ.
# - Pack EASY/SMART/FULL service fees and one-off credits (50/60 EUR na
#   fatura) are not on these sheets and are not modelled.
# - Gas prices (dual offers) are ignored: electricity only. The dual
#   "Gas e Eletricidade" versions carry the same electricity prices.
# - The "dinamica" and "media" entries at the end are NOT from these
#   PDFs: they are EDP Indexada Horaria and Indexada Media
#   (docs/tariff-reference.md §2), kept so one run compares everything.
#   Remove them to compare the fixed offers only.

# Your current contract (the invoice): the "vs ref" column is against it.
reference = "fixa simples -15% energia (12m)"
#reference = "fixa simples especial"

# The tariff that also gets the per-day / monthly battery report.
detailed = "fixa tri-horaria -10% (sempre DD+FE) semanal"


# =====================================================================
# SIMPLES
# =====================================================================

# base, no discount: Eletricidade without direct debit (p.5); the price after the first 12 months of every '12 meses' offer below; Parceria Pingo Doce (whole contract); Eletricidade Verde 'desconto de 50 EUR na fatura' (its EUR 5/month x 10 credit is NOT modelled: take ~EUR 50 off its first year by hand)
[[tariff]]
name = "fixa simples base"
pricing = "fixa"
option = "simples"
fixed_eur_day = 0.4347
prices = { simples = 0.1671 }

