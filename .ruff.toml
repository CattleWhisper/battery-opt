# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# S101: pytest tests use bare assert. PLR2004: the tariff tables ARE magic
# numbers — naming each would obscure the cross-check against the docs.
# DTZ001: naive datetimes are the calendar API contract (local legal time).
# S311: property tests use seeded pseudo-random days; nothing cryptographic.
"tests/**" = ["S101", "PLR2004", "DTZ001", "S311"]
"backtest/**" = ["T201", "PLR2004", "DTZ001"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
